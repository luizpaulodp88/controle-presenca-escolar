{% extends "base.html" %}
{% block title %}{% if aluno %}Editar{% else %}Novo{% endif %} aluno | Presença Escolar{% endblock %}
{% block content %}
<div class="cabecalho-pagina"><div><p class="sobretitulo">CADASTRO</p><h1>{% if aluno %}Editar aluno{% else %}Novo aluno{% endif %}</h1></div></div>
<form class="formulario" method="post">
  <label>Nome completo
    <input name="nome" required maxlength="120" value="{{ aluno.nome if aluno else '' }}" placeholder="Ex.: Ana Souza">
  </label>
  <label>Matrícula
    <input name="matricula" required maxlength="40" value="{{ aluno.matricula if aluno else '' }}" placeholder="Ex.: 2026-001">
  </label>
  <label>Turma
    <input name="turma" required maxlength="40" value="{{ aluno.turma if aluno else '' }}" placeholder="Ex.: 1º A">
  </label>
  <div class="linha-botoes">
    <button class="botao" type="submit">Salvar aluno</button>
    <a class="botao secundario" href="{{ url_for('listar_alunos') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
